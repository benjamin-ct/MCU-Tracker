name: CI

# Runs on every push and PR: typecheck, lint, build. This is the gate that catches
# regressions before either deploy workflow (deploy.yml, preview.yml) ever runs.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
