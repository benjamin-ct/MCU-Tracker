name: Deploy

# Production deploy: only ever runs against the "mcutimeline" Worker (mcuwatchtimeline.com),
# on push to main (i.e. once a migration PR is merged) or manually via workflow_dispatch.
# Needs two repo secrets set in GitHub (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - a token scoped to "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account id that owns the Worker
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
